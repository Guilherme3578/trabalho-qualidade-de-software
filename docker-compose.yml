services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: alocacao
      MYSQL_USER: alocacao
      MYSQL_PASSWORD: alocacao
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-apenas-local}
    ports:
      - "${MYSQL_PORTA:-3306}:3306"
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ualocacao", "-palocacao"]
      interval: 5s
      timeout: 5s
      retries: 30

  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock

  app:
    build: .
    profiles: ["app"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/alocacao
      DB_USUARIO: alocacao
      DB_SENHA: alocacao
      JWT_SEGREDO: ${JWT_SEGREDO:-troque-este-segredo-em-producao-0123456789}
      NOTIFICACAO_HABILITADA: "true"
      NOTIFICACAO_URL: http://wiremock:8080/notificacoes
    ports:
      - "8080:8080"

volumes:
  mysql-dados:
