<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alocação de Salas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
<header class="topo">
    <h1>Alocação de Salas</h1>
    <div id="usuario-logado" class="usuario" hidden>
        <span id="usuario-nome"></span>
        <button id="sair" class="botao secundario" type="button">Sair</button>
    </div>
</header>

<main>
    <div id="mensagem" class="mensagem" role="alert" aria-live="polite" hidden></div>

    <section id="tela-login" class="cartao estreito">
        <h2>Entrar</h2>
        <form id="form-login">
            <label>E-mail
                <input id="login-email" type="email" autocomplete="username" required>
            </label>
            <label>Senha
                <input id="login-senha" type="password" autocomplete="current-password" required>
            </label>
            <button id="login-entrar" class="botao" type="submit">Entrar</button>
        </form>
        <p class="dica">Ambiente de demonstração: admin@senac.br, responsavel@senac.br, coordenador@senac.br,
            ana.souza@senac.br — senha <code>Senha123</code></p>
    </section>

    <section id="tela-app" hidden>
        <nav id="abas" class="abas" aria-label="Seções"></nav>
        <div id="conteudo"></div>
    </section>
</main>

<footer class="rodape">
    <a href="/swagger-ui.html" target="_blank" rel="noopener">Documentação da API</a>
</footer>

<script src="/js/app.js"></script>
</body>
</html>
