spring:
  application:
    name: alocacao-salas
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/alocacao?createDatabaseIfNotExist=true&characterEncoding=UTF-8}
    username: ${DB_USUARIO:alocacao}
    password: ${DB_SENHA:alocacao}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: ${DB_POOL:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-null-for-primitives: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  jwt:
    segredo: ${JWT_SEGREDO:}
    expiracao: 2h
  notificacao:
    habilitada: ${NOTIFICACAO_HABILITADA:false}
    url: ${NOTIFICACAO_URL:http://localhost:8089/notificacoes}
    timeout: 2s
  login:
    max-tentativas: 5
    janela-bloqueio: 15m

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
