name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-e-testes:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Chrome para os testes end-to-end
        uses: browser-actions/setup-chrome@v1

      - name: Build + todos os testes + verificação de cobertura
        run: ./mvnw -B verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/cucumber/
            target/site/jacoco/

      - name: Análise SonarCloud
        if: env.SONAR_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.token=$SONAR_TOKEN

  frontend:
    name: Front-end (Angular)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm 11 (mesma versão do packageManager)
        run: npm install -g npm@11.6.2

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        run: npm run test:ci

      - name: Build de produção
        run: npm run build
